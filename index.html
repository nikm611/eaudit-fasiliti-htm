                    });

                        let height = img.height;
                        if (width > MAX_WIDTH) {
                            height = Math.round((height * MAX_WIDTH) / width);
                            width = MAX_WIDTH;
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const base64 = canvas.toDataURL('image/jpeg', 0.4); 
                        
                        if(type === 'semak') {
                            setJawapanSemak(prev => ({...prev, [`${id}_gambar`]: base64}));
                        } else {
                            setJawapanKebakaran(prev => ({...prev, [`${id}_gambar`]: base64}));
                        }
                    }
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            };

            const removeImage = (id, type) => {
                if(type === 'semak') {
                    const newJawapan = {...jawapanSemak};
                    delete newJawapan[`${id}_gambar`];
                    setJawapanSemak(newJawapan);
                } else {
                    const newJawapan = {...jawapanKebakaran};
                    delete newJawapan[`${id}_gambar`];
                    setJawapanKebakaran(newJawapan);
                }
            };

            const answeredKebakaran = useMemo(() => {
                let count = 0;
                senaraiSoalanKebakaran.forEach(q => {
                    const val = jawapanKebakaran[q.id];
                    if(q.type === 'checkbox') {
                        if(val && val.length > 0) count++;
                    } else {
                        if(val && val.trim() !== '') count++;
                    }
                });
                return count;
            }, [jawapanKebakaran]);

            const calculations = useMemo(() => {
                let ya = 0, tidak = 0, tb = 0;
                Object.keys(jawapanSemak).forEach(key => {
                    if (!key.includes('_ulasan') && !key.includes('_gambar')) {
                        const val = jawapanSemak[key];
                        if(val === '1') ya++;
                        else if(val === '0') tidak++;
                        else if(val === 'tb') tb++;
                    }
                });
                
                const answered = ya + tidak + tb;
                const denominator = totalSoalan - tb;
                const peratus = denominator > 0 ? ((ya / denominator) * 100).toFixed(2) : 0;
                
                return { ya, tidak, tb, answered, denominator, peratus };
            }, [jawapanSemak, totalSoalan]);

            const handleSimpanBahagian = (secKey) => {
                setSavedSection(secKey);
                setTimeout(() => setSavedSection(null), 3000); 
            };

            const handleGenerateReports = async () => {
                setErrorMsg(null);
                
                if(auditorsList.length === 0) return setErrorMsg({ title: "Maklumat Asas Tidak Lengkap", desc: "Sila pilih sekurang-kurangnya seorang Auditor di Maklumat Asas." });
                if(!maklumat.lokasi) return setErrorMsg({ title: "Maklumat Asas Tidak Lengkap", desc: "Sila pilih Lokasi/Bahagian/Wad di Maklumat Asas." });
                if(!maklumat.tarikh) return setErrorMsg({ title: "Maklumat Asas Tidak Lengkap", desc: "Sila pilih Tarikh Pemeriksaan di Maklumat Asas." });
                
                let msgs = [];
                
                let missingWPI = {}; 
                Object.keys(soalanSenaraiSemak).forEach(secKey => {
                    soalanSenaraiSemak[secKey].item.forEach((item, idx) => {
                        if (!jawapanSemak[item.id]) {
                            if(!missingWPI[secKey]) missingWPI[secKey] = [];
                            missingWPI[secKey].push(idx + 1);
                        }
                    });
                });
                
                const wpiKeys = Object.keys(missingWPI);
                if (wpiKeys.length > 0) {
                    let wpiStr = wpiKeys.map(k => `• Seksyen ${k}: Soalan ${missingWPI[k].join(', ')}`).join('\n');
                    msgs.push(`🔴 Senarai Semak WPI:\n${wpiStr}`);
                }
                
                let missingKebakaran = [];
                senaraiSoalanKebakaran.forEach(q => {
                    const val = jawapanKebakaran[q.id];
                    let isAnswered = false;
                    if(q.type === 'checkbox') {
                        if(val && val.length > 0) isAnswered = true;
                    } else {
                        if(val && val.trim() !== '') isAnswered = true;
                    }
                    if (!isAnswered) {
                        let bilMatch = q.soalan.match(/^\d+/);
                        missingKebakaran.push(bilMatch ? bilMatch[0] : q.id);
                    }
                });
                
                if (missingKebakaran.length > 0) {
                    msgs.push(`🔴 Audit Kebakaran:\n• Soalan ${missingKebakaran.join(', ')}`);
                }
                
                if (msgs.length > 0) {
                    return setErrorMsg({
                        title: "Soalan Belum Lengkap",
                        desc: "Laporan tidak dapat dijana. Sila lengkapkan soalan-soalan berikut terlebih dahulu:\n\n" + msgs.join("\n\n")
                    });
                }

                if(!ulasan) return setErrorMsg({ title: "Ulasan Tidak Lengkap", desc: "Sila isi Ulasan Keseluruhan di tab Ulasan & Pengesahan." });
                if(!pengesah) return setErrorMsg({ title: "Pengesahan Tidak Lengkap", desc: "Sila pilih Pegawai Pengesah di tab Ulasan & Pengesahan." });

                setIsGenerating(true); 

                try {
                    const { jsPDF } = window.jspdf;
                    
                    const formatDate = (dateStr) => {
                        if(!dateStr) return '';
                        const d = new Date(dateStr);
                        return `${d.getDate().toString().padStart(2, '0')}/${(d.getMonth()+1).toString().padStart(2, '0')}/${d.getFullYear()}`;
                    };
                    const pengesahObj = auditorsList.find(a => a.nama === pengesah);

                    const docWpi = new jsPDF('p', 'pt', 'a4');
                    let yPosWpi = 40;
                    
                    docWpi.setFontSize(10);
                    docWpi.setFont("helvetica", "bold");
                    docWpi.text("KKP(BKP)/PTK-01", 450, yPosWpi);
                    yPosWpi += 20;
                    docWpi.setFontSize(12);
                    docWpi.text("FORMAT SENARAI SEMAK PEMERIKSAAN TEMPAT KERJA", docWpi.internal.pageSize.getWidth()/2, yPosWpi, {align: "center"});
                    yPosWpi += 15;
                    docWpi.text("AKTIVITI KESELAMATAN DAN KESIHATAN PEKERJAAN KKM", docWpi.internal.pageSize.getWidth()/2, yPosWpi, {align: "center"});
                    yPosWpi += 30;

                    docWpi.setFontSize(10);
                    docWpi.setFont("helvetica", "normal");
                    docWpi.text(`Lokasi / Tempat kerja : ${maklumat.lokasi}`, 40, yPosWpi);
                    yPosWpi += 15;
                    docWpi.text(`Tarikh Pemeriksaan : ${formatDate(maklumat.tarikh)}`, 40, yPosWpi);
                    yPosWpi += 20;
                    
                    docWpi.setFont("helvetica", "italic");
                    docWpi.text("Tandakan (/) pada yang berkenaan.", 40, yPosWpi);
                    yPosWpi += 15;
                    docWpi.text("Pemarkahan: Ya = 1, Tidak = 0, TB = Ditolak dari jumlah denominator", 40, yPosWpi);
                    yPosWpi += 10;

                    const tableBodyWpi = [];
                    Object.keys(soalanSenaraiSemak).forEach(secKey => {
                        const section = soalanSenaraiSemak[secKey];
                        tableBodyWpi.push([
                            { content: section.tajuk, colSpan: 6, styles: { fontStyle: 'bold', fillColor: [240, 240, 240], textColor: [0,0,0] } }
                        ]);
                        section.item.forEach((item, idx) => {
                            const ans = jawapanSemak[item.id];
                            const ulas = jawapanSemak[`${item.id}_ulasan`] || '';
                            const gambar = jawapanSemak[`${item.id}_gambar`];
                            
                            let ulasanContent = ulas;
                            if (gambar) ulasanContent += '\n\n\n\n\n\n'; 

                            tableBodyWpi.push([
                                idx + 1,
                                item.soalan,
                                ans === '1' ? '/' : '',
                                ans === '0' ? '/' : '',
                                (ans === 'tb' && secKey !== 'A') ? '/' : (secKey === 'A' ? '-' : ''),
                                { content: ulasanContent, gambar: gambar }
                            ]);
                        });
                    });

                    tableBodyWpi.push([
                        { content: `Jumlah (Bil "Ya" / Denominator) x 100 =\n( ${calculations.ya} / ${calculations.denominator} ) x 100 = ${calculations.peratus}%\n\n* Denominator: Jumlah adalah tidak termasuk item 'Tidak Berkenaan' (TB)`, colSpan: 6, styles: { fontStyle: 'bold', halign: 'left' } }
                    ]);

                    docWpi.autoTable({
                        startY: yPosWpi,
                        head: [['Bil', 'Perkara', 'Ya\n(1)', 'Tidak\n(0)', 'TB', 'Ulasan']],
                        body: tableBodyWpi,
                        theme: 'grid',
                        styles: { font: 'helvetica', fontSize: 9, cellPadding: 4 },
                        headStyles: { fillColor: [50, 50, 50], textColor: [255, 255, 255], halign: 'center' },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 30 },
                            1: { cellWidth: 240 },
                            2: { halign: 'center', cellWidth: 35 },
                            3: { halign: 'center', cellWidth: 35 },
                            4: { halign: 'center', cellWidth: 35 },
                            5: { cellWidth: 'auto' }
                        },
                        didDrawCell: function (data) {
                            if (data.column.index === 5 && data.cell.section === 'body' && data.cell.raw && data.cell.raw.gambar) {
                                const imgData = data.cell.raw.gambar;
                                const dimX = 50;
                                const dimY = 35;
                                const posX = data.cell.x + 5;
                                const posY = data.cell.y + data.cell.height - dimY - 5; 
                                docWpi.addImage(imgData, 'JPEG', posX, posY, dimX, dimY);
                            }
                        },
                        didDrawPage: function (data) {
                            let str = "Sektor Keselamatan dan Kesihatan Pekerjaan (KKP), Bahagian Kawalan Penyakit (BKP), KKM 2024";
                            docWpi.setFontSize(8);
                            docWpi.text(str, data.settings.margin.left, docWpi.internal.pageSize.height - 20);
                        }
                    });

                    let finalYWpi = docWpi.lastAutoTable.finalY + 30;
                    if(finalYWpi > docWpi.internal.pageSize.height - 150) {
                        docWpi.addPage();
                        finalYWpi = 40;
                    }

                    docWpi.setFontSize(10);
                    docWpi.setFont("helvetica", "bold");
                    docWpi.text("Ulasan:", 40, finalYWpi);
                    docWpi.setFont("helvetica", "normal");
                    
                    const fullUlasanText = "Secara keseluruhan, persekitaran tempat kerja " + (ulasan || "");
                    const splitUlasan = docWpi.splitTextToSize(fullUlasanText, 500);
                    docWpi.text(splitUlasan, 40, finalYWpi + 15);
                    finalYWpi += (splitUlasan.length * 12) + 30;

                    docWpi.setFont("helvetica", "bold");
                    docWpi.text("Pengesahan Pemeriksaan Tempat Kerja:", 40, finalYWpi);
                    finalYWpi += 30;
                    
                    docWpi.setFont("helvetica", "normal");
                    docWpi.text("Dilaporkan oleh Pegawai Pemeriksa,", 40, finalYWpi);
                    docWpi.text("Disahkan oleh (Ketua Unit),", 300, finalYWpi);
                    finalYWpi += 50; 
                    
                    docWpi.text(`Nama: ${pengesahObj ? pengesahObj.nama : ''}`, 40, finalYWpi);
                    docWpi.text(`Tarikh : ${formatDate(tarikhPengesahan)}`, 40, finalYWpi + 15);
                    docWpi.text("Nama:", 300, finalYWpi);
                    docWpi.text("Tarikh:", 300, finalYWpi + 15);

                    const docFire = new jsPDF('p', 'pt', 'a4');
                    let yPosFire = 40;
                    
                    docFire.setFontSize(14);
                    docFire.setFont("helvetica", "bold");
                    docFire.text("LAPORAN AUDIT KESELAMATAN KEBAKARAN", docFire.internal.pageSize.getWidth()/2, yPosFire, {align: "center"});
                    yPosFire += 25;
                    
                    docFire.setFontSize(10);
                    docFire.setFont("helvetica", "normal");
                    docFire.text(`Lokasi / Tempat kerja : ${maklumat.lokasi}`, 40, yPosFire);
                    yPosFire += 15;
                    docFire.text(`Tarikh Pemeriksaan : ${formatDate(maklumat.tarikh)}`, 40, yPosFire);
                    yPosFire += 25;

                    const tableBodyFire = [];
                    senaraiSoalanKebakaran.forEach(q => {
                        if(q.sec) {
                            tableBodyFire.push([{ content: q.sec.toUpperCase(), colSpan: 3, styles: { fontStyle: 'bold', fillColor: [240, 240, 240], textColor: [0,0,0] } }]);
                        }
                        
                        let jawapanRaw = jawapanKebakaran[q.id];
                        let jawapanStr = Array.isArray(jawapanRaw) ? jawapanRaw.join(", ") : (jawapanRaw || "");
                        if(q.type === 'date' && jawapanStr) jawapanStr = formatDate(jawapanStr);

                        let catatan = jawapanKebakaran[`${q.id}_other`] || "";
                        let gambar = jawapanKebakaran[`${q.id}_gambar`];
                        
                        let finalAns = jawapanStr;
                        if (catatan) finalAns += `\n(Ulasan: ${catatan})`;
                        if (gambar) finalAns += `\n\n\n\n\n\n`; 

                        let qText = q.soalan.replace(/^\d+\.\s*/, '');
                        let bil = q.soalan.match(/^\d+/)[0];

                        tableBodyFire.push([bil, qText, { content: finalAns, gambar: gambar }]);
                    });

                    docFire.autoTable({
                        startY: yPosFire,
                        head: [['Bil', 'Perkara', 'Jawapan / Tindakan']],
                        body: tableBodyFire,
                        theme: 'grid',
                        styles: { font: 'helvetica', fontSize: 9, cellPadding: 5 },
                        headStyles: { fillColor: [180, 50, 50], textColor: [255, 255, 255], halign: 'center' },
                        columnStyles: {
                            0: { halign: 'center', cellWidth: 30 },
                            1: { cellWidth: 280 },
                            2: { cellWidth: 'auto' }
                        },
                        didDrawCell: function (data) {
                            if (data.column.index === 2 && data.cell.section === 'body' && data.cell.raw && data.cell.raw.gambar) {
                                const imgData = data.cell.raw.gambar;
                                const dimX = 50;
                                const dimY = 35;
                                const posX = data.cell.x + 5;
                                const posY = data.cell.y + data.cell.height - dimY - 5; 
                                docFire.addImage(imgData, 'JPEG', posX, posY, dimX, dimY);
                            }
                        }
                    });
                    
                    let finalYFire = docFire.lastAutoTable.finalY + 30;
                    if(finalYFire > docFire.internal.pageSize.height - 100) {
                        docFire.addPage();
                        finalYFire = 40;
                    }

                    docFire.setFont("helvetica", "bold");
                    docFire.text("Pengesahan Pemeriksaan Tempat Kerja (Kebakaran):", 40, finalYFire);
                    finalYFire += 30;
                    docFire.setFont("helvetica", "normal");
                    docFire.text("Dilaporkan oleh Pegawai Pemeriksa,", 40, finalYFire);
                    finalYFire += 50;
                    docFire.text(`Nama: ${pengesahObj ? pengesahObj.nama : ''}`, 40, finalYFire);
                    docFire.text(`Tarikh : ${formatDate(tarikhPengesahan)}`, 40, finalYFire + 15);

                    const pdfWpiBase64 = docWpi.output('datauristring').split(',')[1];
                    const pdfFireBase64 = docFire.output('datauristring').split(',')[1];

                    const namaAuditors = auditorsList.map(a => `${a.nama} (${a.jawatan})`).join(", ");

                    let rowKkp = [
                        formatDate(maklumat.tarikh), maklumat.lokasi, namaAuditors,
                        calculations.ya, calculations.tidak, calculations.tb, calculations.peratus + '%',
                        ulasan, pengesah, formatDate(tarikhPengesahan)
                    ];
                    
                    Object.keys(soalanSenaraiSemak).forEach(secKey => {
                        soalanSenaraiSemak[secKey].item.forEach(item => {
                            rowKkp.push(jawapanSemak[item.id] || ''); 
                            let combinedUlasan = jawapanSemak[`${item.id}_ulasan`] || '';
                            if (jawapanSemak[`${item.id}_gambar`]) {
                                let b64 = jawapanSemak[`${item.id}_gambar`];
                                if(b64.length > 45000) b64 = b64.substring(0, 45000) + "...[GAMBAR]";
                                combinedUlasan += '\n\n[GAMBAR:\n' + b64 + ']';
                            }
                            rowKkp.push(combinedUlasan); 
                        });
                    });

                    let rowKebakaran = [
                        formatDate(maklumat.tarikh), maklumat.lokasi, namaAuditors, pengesah, formatDate(tarikhPengesahan)
                    ];
                    
                    senaraiSoalanKebakaran.forEach(q => {
                        let val = jawapanKebakaran[q.id];
                        let valStr = Array.isArray(val) ? val.join(", ") : (val || "");
                        rowKebakaran.push(valStr); 
                        
                        let combinedCatatan = jawapanKebakaran[`${q.id}_other`] || '';
                        if (jawapanKebakaran[`${q.id}_gambar`]) {
                            let b64 = jawapanKebakaran[`${q.id}_gambar`];
                            if(b64.length > 45000) b64 = b64.substring(0, 45000) + "...[GAMBAR]";
                            combinedCatatan += '\n\n[GAMBAR:\n' + b64 + ']';
                        }
                        rowKebakaran.push(combinedCatatan); 
                    });

                    const payload = {
                        pdfWpiBase64: pdfWpiBase64,
                        filenameWpi: `Laporan_Audit_WPI_${maklumat.lokasi.replace(/[^a-zA-Z0-9]/g, '_')}_${maklumat.tarikh}.pdf`,
                        rowKkp: rowKkp,

                        pdfKebakaranBase64: pdfFireBase64,
                        filenameKebakaran: `Laporan_Audit_Kebakaran_${maklumat.lokasi.replace(/[^a-zA-Z0-9]/g, '_')}_${maklumat.tarikh}.pdf`,
                        rowKebakaran: rowKebakaran
                    };

                    await fetch(GOOGLE_SCRIPT_URL, {
                        method: "POST",
                        mode: "no-cors", 
                        body: JSON.stringify(payload),
                        headers: { "Content-Type": "text/plain;charset=utf-8" }
                    });

                    docWpi.save(payload.filenameWpi);
                    
                    setTimeout(() => {
                        docFire.save(payload.filenameKebakaran);
                        setIsGenerating(false); 
                        setShowSuccessModal(true);
                    }, 800);
                    
                } catch (err) {
                    console.error(err);
                    setIsGenerating(false);
                    setErrorMsg({ title: "Ralat Penjanaan", desc: "Ralat menjana PDF atau berhubung dengan server. Sila hubungi pentadbir sistem."});
                }
            };

            const NavItem = ({ id, label, icon: Icon }) => (
                <button 
                    onClick={() => setActiveTab(id)}
                    className={`flex items-center gap-3 px-4 py-3 rounded-lg text-sm font-medium transition-colors whitespace-nowrap min-h-[48px] ${
                        activeTab === id 
                        ? 'bg-indigo-600 text-white shadow-md' 
                        : 'text-slate-300 hover:bg-slate-800 hover:text-white'
                    }`}
                >
                    <Icon />
                    <span className="text-left">{label}</span>
                </button>
            );

            return (
                <div className="flex flex-col md:flex-row h-screen overflow-hidden bg-slate-50 relative">
                    
                    {/* Sidebar / Top Nav for Mobile */}
                    <div className="w-full md:w-72 bg-slate-900 text-white shadow-xl flex flex-col z-20 shrink-0">
                        <div className="p-4 md:p-6 flex flex-row md:flex-col items-center justify-between md:justify-start border-b border-slate-800 gap-4">
                            <img src="LOGO HTM_2.jpg" alt="Jata Negara KKM HTM" className="w-16 h-auto md:w-[85%] md:mb-4 bg-white rounded-lg p-1.5 md:p-2 object-contain shadow-sm" onError={(e) => {e.target.style.display='none'}} />
                            <h1 className="text-base md:text-xl font-bold text-white tracking-tight leading-tight md:text-center flex-1 text-right md:w-full">
                                e-Audit Fasiliti<br className="hidden md:block"/><span className="text-indigo-400 text-xs md:text-sm font-medium md:mt-1 block">Hospital Tanah Merah</span>
                            </h1>
                        </div>
                        
                        <nav className="flex-none flex flex-row md:flex-col px-2 py-2 md:px-4 md:py-4 space-x-2 md:space-x-0 md:space-y-2 overflow-x-auto md:overflow-y-auto w-full custom-scrollbar">
                            <NavItem id="maklumat" label="Maklumat Asas" icon={Icons.Info} />
                            <NavItem id="senarai-semak" label="Senarai Semak WPI KKP(BKP)/PTK-01" icon={Icons.Checklist} />
                            <NavItem id="audit-kebakaran" label="Audit Kebakaran" icon={Icons.FireExtinguisher} />
                            <NavItem id="ulasan" label="Ulasan & Pengesahan" icon={Icons.Signature} />
                        </nav>
                        
                        <div className="hidden md:block p-4 border-t border-slate-800">
                            <button 
                                onClick={handleGenerateReports}
                                disabled={isGenerating}
                                className="w-full min-h-[48px] flex items-center justify-center gap-2 bg-indigo-500 hover:bg-indigo-400 text-white px-4 py-3 rounded-lg font-semibold transition-all shadow-lg hover:shadow-indigo-500/30 disabled:bg-indigo-400 disabled:cursor-wait"
                            >
                                {isGenerating ? <span className="animate-spin text-xl">&#9696;</span> : <Icons.Document />} 
                                Jana Laporan PDF
                            </button>
                        </div>
                    </div>

                    {}
                    <div className="flex-1 flex flex-col h-full overflow-hidden relative">
                        <header className="bg-white border-b border-gray-200 px-4 py-3 md:px-8 md:py-4 flex justify-between items-center z-10 shrink-0">
                            <div className="flex items-center">
                                <img src="LOGO HTM (1)_2.jpg" alt="Logo HTM" className="h-10 md:h-16 object-contain" onError={(e) => {e.target.onerror = null; e.target.src="https://placehold.co/100x100/ffffff/4f46e5?text=HTM"}} />
                            </div>
                            <div className="text-center flex-1 px-2 hidden sm:block">
                                <h2 className="text-sm md:text-lg font-bold text-slate-800 line-clamp-1">Unit Kesihatan Awam</h2>
                                <p className="text-xs md:text-sm text-slate-500 line-clamp-1">Hospital Tanah Merah, Kelantan</p>
                            </div>
                            <div className="flex items-center">
                                <img src="LOGO UKA MEI 2026_2.jpg" alt="Logo UKA" className="h-10 md:h-16 object-contain" onError={(e) => {e.target.onerror = null; e.target.src="https://placehold.co/100x100/ffffff/4f46e5?text=UKA"}}/>
                            </div>
                        </header>

                        {errorMsg && (
                            <div className="absolute top-4 left-1/2 transform -translate-x-1/2 bg-red-50 border border-red-200 text-red-900 p-4 md:p-6 rounded-xl shadow-2xl z-50 flex items-start justify-between w-[95%] md:w-auto md:min-w-[500px] max-w-2xl ring-4 ring-red-500/10">
                                <div className="flex-1 mr-4">
                                    <h3 className="font-bold text-base md:text-lg text-red-700 mb-2 border-b border-red-200 pb-2">{errorMsg.title}</h3>
                                    <p className="whitespace-pre-wrap text-xs md:text-sm font-medium text-red-800 leading-relaxed">{errorMsg.desc}</p>
                                </div>
                                <button onClick={() => setErrorMsg(null)} className="ml-2 min-w-[32px] min-h-[32px] bg-red-100 hover:bg-red-200 text-red-700 rounded-full flex items-center justify-center font-bold text-xl transition-colors">&times;</button>
                            </div>
                        )}

                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            <div className="max-w-4xl mx-auto w-full">
                                
                                {}
                                {activeTab === 'maklumat' && (
                                    <div className="tab-content bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
                                        <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 md:mb-6 border-b pb-4">Maklumat Asas Pemeriksaan</h2>
                                        
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-8">
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-2">Lokasi/Bahagian/Wad</label>
                                                <select 
                                                    name="lokasi"

                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-[90vw] md:max-w-md text-center relative animate-[fadeIn_0.3s_ease-out] overflow-y-auto max-h-[90vh]">
                                <Icons.CheckCircle />
                                <h3 className="text-xl md:text-2xl font-bold text-slate-800 mb-2 mt-4">Tahniah! Laporan Selesai</h3>
                                <p className="text-slate-600 mb-6 text-sm md:text-base">Laporan PDF untuk <b>Senarai Semak WPI</b> dan <b>Audit Kebakaran</b> telah berjaya dijana dan dimuat turun.</p>
                                
                                <div className="bg-green-50 text-green-800 p-4 rounded-lg text-sm mb-4 text-left border border-green-200 shadow-inner">
                                    <span className="font-bold text-green-900 block mb-1">Berjaya Disimpan!</span>
                                    Sistem turut menghantar salinan PDF dan Data Log ke pangkalan data rasmi Google Drive dan Excel KKP Unit UKA.
                                </div>

                                <div className="bg-yellow-50 text-yellow-800 p-4 rounded-lg text-sm mb-6 text-left border border-yellow-200 shadow-inner leading-relaxed">
                                    <span className="font-bold text-yellow-900 block mb-1">Peringatan Pintar:</span>
                                    Sistem ini memuat turun **dua (2) fail PDF** serentak. Jika peranti anda menghalang fail kedua, sila lihat di <i>Address Bar</i> (atas skrin) dan benarkan "Multiple Downloads" atau "Pop-ups".
                                </div>
                                
                                <button 
                                    onClick={() => setShowSuccessModal(false)} 
                                    className="w-full min-h-[56px] bg-slate-800 text-white font-bold text-lg py-3 rounded-xl hover:bg-slate-700 transition-colors shadow-md"
                                >
                                    Tutup & Selesai
                                </button>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
