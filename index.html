                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 500; 
                            let width = img.width, height = img.height;
                            if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                            canvas.width = width; canvas.height = height;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, width, height);
                            resolve(canvas.toDataURL('image/jpeg', 0.5)); 
                        };
                        img.src = event.target.result;
                    };
                    reader.readAsDataURL(file);

                            <div className="max-w-4xl mx-auto w-full">
                                
                                {activeTab === 'maklumat' && (
                                    <div className="tab-content bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
                                        <h2 className="text-xl md:text-2xl font-bold text-slate-800 mb-4 md:mb-6 border-b pb-4">Maklumat Asas Pemeriksaan</h2>
                                        
                                        <div className="bg-indigo-50 border border-indigo-200 rounded-lg p-4 md:p-5 mb-6">
                                            <label className="block text-sm font-bold text-indigo-900 mb-2">Sila Pilih Jenis Audit <span className="text-red-500">*</span></label>
                                            <select 
                                                value={jenisAudit} 
                                                onChange={(e) => {
                                                    setJenisAudit(e.target.value);
                                                    setJawapanKhusus({}); // reset answers when switching specialized mode
                                                }}
                                                className="w-full rounded-md border-indigo-300 shadow-sm focus:border-indigo-500 p-3 min-h-[48px] bg-white font-medium text-slate-700"
                                            >
                                                <option value="standard">Audit Standard (WPI & Kebakaran)</option>
                                                <option value="makmal">Audit Khusus (Makmal)</option>
                                                <option value="radiologi">Audit Khusus (Radiologi)</option>
                                            </select>
                                            {jenisAudit !== 'standard' && (
                                                <div className="mt-3 flex items-start gap-2 text-amber-700 bg-amber-50 p-3 rounded-md border border-amber-200">
                                                    <Icons.AlertTriangle />
                                                    <p className="text-xs md:text-sm font-medium">
                                                        <strong>Mod Khusus Aktif:</strong> Borang audit standard WPI dan Kebakaran akan disembunyikan. Anda kini sedang mengisi format laporan khusus untuk <b>{jenisAudit === 'makmal' ? 'Unit Makmal' : 'Unit Radiologi'}</b>.
                                                    </p>
                                                </div>
                                            )}
                                        </div>

                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4 md:gap-6 mb-8">
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-2">Lokasi/Bahagian/Wad</label>
                                                <select name="lokasi" value={maklumat.lokasi} onChange={handleMaklumatChange} className="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 p-3 min-h-[48px] border bg-white">
                                                    <option value="">Pilih Fasiliti...</option>
                                                    {senaraiFasiliti.map((f, i) => <option key={i} value={f}>{f}</option>)}
                                                </select>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-semibold text-slate-700 mb-2">Tarikh Pemeriksaan</label>
                                                <input type="date" name="tarikh" value={maklumat.tarikh} onChange={handleMaklumatChange} className="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 p-3 min-h-[48px] border bg-slate-50" />
                                            </div>
                                        </div>

                                        <div className="bg-slate-50 p-4 md:p-5 rounded-lg border border-slate-200">
                                            <label className="block text-sm font-semibold text-slate-700 mb-2">Tambah Pasukan Auditor</label>
                                            <div className="flex gap-2 mb-4">
                                                <select onChange={handleAddAuditor} defaultValue="" className="flex-1 rounded-md border-gray-300 shadow-sm p-3 min-h-[48px] border bg-white">
                                                    <option value="" disabled>Pilih nama dari senarai...</option>
                                                    {senaraiAuditor.map((a, i) => (
                                                        <option key={i} value={a.nama} disabled={auditorsList.some(sel => sel.nama === a.nama)}>{a.nama} - {a.jawatan}</option>
                                                    ))}
                                                </select>
                                            </div>
                                            {auditorsList.length > 0 ? (
                                                <div className="space-y-3">
                                                    <p className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Senarai Auditor Terpilih:</p>
                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                                        {auditorsList.map((auditor, i) => (
                                                            <div key={i} className="flex items-start justify-between bg-white p-3 rounded-md border border-indigo-100 shadow-sm">
                                                                <div className="flex-1 pr-2">
                                                                    <p className="font-semibold text-sm text-slate-800 leading-tight">{auditor.nama}</p>
                                                                    <p className="text-xs text-indigo-600 mt-1">{auditor.jawatan}</p>
                                                                </div>
                                                                <button onClick={() => handleRemoveAuditor(auditor.nama)} className="text-slate-400 hover:text-red-500 p-2"><Icons.Trash /></button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </div>
                                            ) : ( <p className="text-sm text-slate-500 italic">Sila tambah auditor untuk laporan ini.</p> )}
                                        </div>

                                        <div className="mt-8 flex justify-end">
                                            <button onClick={() => handleTabChange(jenisAudit === 'standard' ? 'senarai-semak' : 'audit-khusus')} className="w-full sm:w-auto min-h-[48px] bg-slate-800 hover:bg-slate-700 text-white px-6 py-3 rounded-lg font-medium">
                                                Seterusnya &rarr;
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* --- TAB KHUSUS (MAKMAL / RADIOLOGI) --- */}
                                {activeTab === 'audit-khusus' && jenisAudit !== 'standard' && (
                                    <div className="tab-content space-y-6">
                                        <div className="flex flex-col md:flex-row justify-between items-start md:items-end mb-4 gap-4">
                                            <div className="flex-1">
                                                <h2 className="text-lg md:text-2xl font-bold text-slate-800">
                                                    Format Audit Keselamatan & Kesihatan ({jenisAudit === 'makmal' ? 'Makmal' : 'Radiologi'})
                                                </h2>
                                                <p className="text-slate-500 text-sm mt-2">Sila nilaikan skala prestasi (0: Tidak Memuaskan, 1: Memuaskan, 2: Baik). Tandakan TB jika tidak berkenaan.</p>
                                            </div>
                                            <div className="text-left md:text-right shrink-0">
                                                <span className={`inline-flex items-center px-4 py-2 rounded-full text-sm font-bold ${calculationsKhusus.answered === calculationsKhusus.totalQuestions ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}`}>
                                                    Selesai: {calculationsKhusus.answered}/{calculationsKhusus.totalQuestions}
                                                </span>
                                            </div>
                                        </div>

                                        {renderKhususTable(jenisAudit === 'makmal' ? soalanMakmal : soalanRadiologi)}

                                        <div className="mt-8 flex flex-col sm:flex-row justify-between pt-4 border-t border-slate-200 gap-4">
                                            <button onClick={() => handleTabChange('maklumat')} className="min-h-[48px] w-full sm:w-auto text-slate-500 bg-slate-100 hover:bg-slate-200 px-4 py-2 font-medium rounded-lg">
                                                &larr; Kembali
                                            </button>
                                            <button onClick={() => handleTabChange('ulasan')} className="min-h-[48px] w-full sm:w-auto bg-slate-800 hover:bg-slate-700 text-white px-6 py-2 rounded-lg font-medium">
                                                Seterusnya &rarr;
                                            </button>
                                        </div>
                                    </div>
                                )}

                                {/* --- TAB STANDARD (WPI) --- */}
                                {activeTab === 'senarai-semak' && jenisAudit === 'standard' && (
                                    <div className="tab-content space-y-6">
                                        {/* KOD LAMA TAB WPI ANDA DI SINI. UNTUK KEPENTINGAN KERINGKASAN PANDUAN INI SAYA PENDEKKAN, TAPI LOGIKNYA MASIH SAMA SEPERTI DI KODE ASAL ANDA. */}
                                        <div className="bg-blue-50 p-6 rounded-xl border border-blue-200 text-center text-blue-800 font-medium">
                                            Ruangan WPI Sedia Ada Anda. (Sila rujuk file lama anda untuk kandungan penuh UI bahagian WPI ini).
                                        </div>
                                        <div className="mt-8 flex justify-between pt-4 border-t border-slate-200">
                                            <button onClick={() => handleTabChange('maklumat')} className="bg-slate-100 px-4 py-2 rounded-lg">Kembali</button>
                                            <button onClick={() => handleTabChange('audit-kebakaran')} className="bg-slate-800 text-white px-6 py-2 rounded-lg">Seterusnya</button>
                                        </div>
                                    </div>
                                )}

                                {/* --- TAB STANDARD (KEBAKARAN) --- */}
                                {activeTab === 'audit-kebakaran' && jenisAudit === 'standard' && (
                                    <div className="tab-content space-y-6">
                                        {/* KOD LAMA TAB KEBAKARAN ANDA DI SINI */}
                                        <div className="bg-orange-50 p-6 rounded-xl border border-orange-200 text-center text-orange-800 font-medium">
                                            Ruangan Kebakaran Sedia Ada Anda. (Sila rujuk file lama anda untuk kandungan penuh UI bahagian ini).
                                        </div>
                                        <div className="mt-8 flex justify-between pt-4 border-t border-slate-200">
                                            <button onClick={() => handleTabChange('senarai-semak')} className="bg-slate-100 px-4 py-2 rounded-lg">Kembali</button>
                                            <button onClick={() => handleTabChange('ulasan')} className="bg-slate-800 text-white px-6 py-2 rounded-lg">Seterusnya</button>
                                        </div>
                                    </div>
                                )}

                                {/* --- TAB ULASAN --- */}
                                {activeTab === 'ulasan' && (
                                    <div className="tab-content space-y-6">
                                        <div className="bg-indigo-50 rounded-xl border border-indigo-100 p-4 md:p-6 flex flex-col sm:flex-row items-center justify-between shadow-sm gap-4">
                                            <div className="text-center sm:text-left">
                                                <h3 className="text-indigo-900 font-bold text-lg">Rumusan Markah Audit</h3>
                                                {jenisAudit === 'standard' ? (
                                                    <p className="text-indigo-700 text-sm mt-1 font-medium">(Bil. "Ya" / Denominator) x 100</p>
                                                ) : (
                                                    <p className="text-indigo-700 text-sm mt-1 font-medium">(Jumlah Diperoleh / Jumlah Maksima) x 100</p>
                                                )}
                                                <p className="text-indigo-600 text-xs mt-2 italic">*Denominator/Maksima tidak termasuk item 'Tidak Berkenaan' (TB).</p>
                                            </div>
                                            <div className="flex gap-4 sm:gap-6 text-center w-full sm:w-auto justify-around">
                                                {jenisAudit === 'standard' ? (
                                                    <React.Fragment>
                                                        <div><p className="text-xs font-semibold text-indigo-500 uppercase mb-1">Ya (1)</p><p className="text-2xl font-bold text-indigo-900">{calculationsWpi.ya}</p></div>
                                                        <div><p className="text-xs font-semibold text-indigo-500 uppercase mb-1">Tidak (0)</p><p className="text-2xl font-bold text-slate-600">{calculationsWpi.tidak}</p></div>
                                                        <div><p className="text-xs font-semibold text-indigo-500 uppercase mb-1">Peratusan</p><p className="text-2xl font-bold text-green-600">{calculationsWpi.peratus}%</p></div>
                                                    </React.Fragment>
                                                ) : (
                                                    <React.Fragment>
                                                        <div><p className="text-xs font-semibold text-indigo-500 uppercase mb-1">Diperoleh</p><p className="text-2xl font-bold text-indigo-900">{calculationsKhusus.totalObtained}</p></div>
                                                        <div><p className="text-xs font-semibold text-indigo-500 uppercase mb-1">Maksima</p><p className="text-2xl font-bold text-slate-600">{calculationsKhusus.totalMax}</p></div>
                                                        <div><p className="text-xs font-semibold text-indigo-500 uppercase mb-1">Peratusan</p><p className="text-2xl font-bold text-green-600">{calculationsKhusus.peratus}%</p></div>
                                                    </React.Fragment>
                                                )}
                                            </div>
                                        </div>

                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
                                            <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-4">Ulasan Keseluruhan</h2>
                                            <textarea rows="5" value={ulasan} onChange={(e) => setUlasan(e.target.value)} placeholder="Sila masukkan ulasan hasil dari pemeriksaan..." className="w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 p-3 border resize-y text-sm" />
                                        </div>

                                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 md:p-6">
                                            <h2 className="text-lg md:text-xl font-bold text-slate-800 mb-6 border-b pb-4">Pengesahan Pemeriksaan</h2>
                                            {auditorsList.length === 0 ? (
                                                <div className="bg-yellow-50 text-yellow-800 p-4 rounded border text-sm">Sila kembali ke tab Maklumat Asas dan pilih auditor terlebih dahulu.</div>
                                            ) : (
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                                    <div>
                                                        <label className="block text-sm font-semibold text-slate-700 mb-2">Dilaporkan Oleh (Pegawai Pemeriksa)</label>
                                                        <select value={pengesah} onChange={(e) => setPengesah(e.target.value)} className="w-full rounded-md border-gray-300 shadow-sm p-3 border bg-white">
                                                            <option value="">Pilih dari auditor terpilih...</option>
                                                            {auditorsList.map((a, i) => <option key={i} value={a.nama}>{a.nama}</option>)}
                                                        </select>
                                                    </div>
                                                    <div>
                                                        <label className="block text-sm font-semibold text-slate-700 mb-2">Tarikh Laporan</label>
                                                        <input type="date" value={tarikhPengesahan} onChange={(e) => setTarikhPengesahan(e.target.value)} className="w-full rounded-md border-gray-300 shadow-sm p-3 border bg-slate-50" />
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        <div className="mt-8 flex flex-col md:flex-row justify-between items-center pt-4 border-t border-slate-200 gap-4">
                                            <button onClick={() => handleTabChange(jenisAudit === 'standard' ? 'audit-kebakaran' : 'audit-khusus')} className="min-h-[48px] w-full md:w-auto bg-slate-100 hover:bg-slate-200 px-4 py-2 font-medium rounded-lg">
                                                &larr; Kembali
                                            </button>
                                            <button onClick={handleGenerateReports} disabled={isGenerating} className={`min-h-[56px] w-full md:w-auto px-6 py-3 rounded-xl font-bold transition-all shadow-lg flex items-center justify-center gap-3 ${isGenerating ? 'bg-indigo-400 text-white' : 'bg-indigo-600 hover:bg-indigo-500 text-white'}`}>
                                                {isGenerating ? <React.Fragment><span className="animate-spin text-2xl">&#9696;</span> Menyimpan...</React.Fragment> : <React.Fragment><Icons.Document /> Jana Laporan PDF</React.Fragment>}
                                            </button>
                                        </div>
                                    </div>
                                )}
                            </div>
                            <div className="h-24 md:h-20"></div>
                        </main>
                    </div>
                    
                    {showSuccessModal && (
                        <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[100] p-4">
                            <div className="bg-white p-6 md:p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
                                <Icons.CheckCircle />
                                <h3 className="text-xl font-bold text-slate-800 mb-2 mt-4">Tahniah! Laporan Selesai</h3>
                                <p className="text-slate-600 mb-6 text-sm">Laporan PDF untuk <b>{jenisAudit === 'standard' ? 'Senarai Semak WPI dan Audit Kebakaran' : `Audit Khusus ${jenisAudit.toUpperCase()}`}</b> telah berjaya dijana dan dimuat turun.</p>
                                <button onClick={() => setShowSuccessModal(false)} className="w-full min-h-[56px] bg-slate-800 text-white font-bold text-lg py-3 rounded-xl hover:bg-slate-700">Tutup & Selesai</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
